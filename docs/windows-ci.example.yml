name: Windows build and tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'codex_switcher/**'
      - 'tests/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression suite
        run: python -m unittest discover -s tests
      - name: Build standalone portable app
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-portable
          path: dist/Codex-Model-Switcher-Windows-x64-portable.zip
          if-no-files-found: error
